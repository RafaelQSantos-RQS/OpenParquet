name: Audit Code

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Deps
        run: bun install --frozen-lockfile

      - name: Typecheck + Build (Vue/Vite)
        run: bun run build

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check Rust Code (Clippy)
        working-directory: ./src-tauri
        run: cargo clippy -- -D warnings

  # Aggregator: keeps the "check-quality" context required by the branch ruleset
  check-quality:
    needs: [frontend-check, backend-check]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"